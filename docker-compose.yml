version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: asset-management-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin@postgres123
      POSTGRES_DB: asset_management
      POSTGRES_INITDB_ARGS: "-c max_connections=1000 -c shared_buffers=256MB -c effective_cache_size=1GB"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d asset_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asset-network

  # PgBouncer (Connection Pooling)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: asset-management-pgbouncer
    restart: always
    environment:
      DATABASE_URL: "postgres://admin:admin@postgres123@postgres:5432/asset_management"
      PGBOUNCER_POOL_MODE: "transaction"
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asset-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: asset-management-cache
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asset-network

  # Adminer (Database GUI - optional)
  adminer:
    image: adminer:latest
    container_name: asset-management-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - asset-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  asset-network:
    driver: bridge
